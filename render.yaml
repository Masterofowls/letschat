services:
  - type: web
    name: letschat-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: letschat-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: USE_PG_PUBSUB
        value: "false"

databases:
  - name: letschat-db
    plan: free
